# ブランド別の編集レンズ(社説面)
#
# 社説の書き手が、その日の主題ブランドについて**何を見落としやすいか**を思い出すための札。
# `prompts/AI_kassy_prompt_package_v1.md` の「ブランド温度カード」を土台に、
# この新聞の社説向けへ作り直したもの。
#
# **ここに作品の歴史・設定・事実を書かないこと。**
#
#   社説の事実源は当日の紙面記事だけ、という一線が憲法にある
#   (prompts/columnist-core.md「事実は当日の紙面記事にあるものだけ」)。
#   元のカードには core_producer_relation や historical_axis といった、
#   作品についての主張を含む欄がある。それを社説へ渡すと、
#   **当日の紙面に無い事実を書き手が使えてしまう**(監査指摘)。
#   だからここには「問い」と「避けること」しか置かない。断定を置かない。
#
# 使い方: 社説プロンプトは**当日の主題ブランド1つぶんだけ**を差し込む。
# 全ブランドを並べて渡さない(並べると全部を意識した網羅的な文章になる)。
#
# 注意: これは語彙集ではない。ここの言い回しをそのまま本文へ書き写したら失敗である。
# 見落としを防ぐための問いであって、書くべき結論ではない。

general:
  ask:
    - この話題は、どのブランドの誰にとっての出来事なのか。総合面に置いたことで、当事者がぼやけていないか
  avoid:
    - 「アイマス全体が」と大きな主語で語り、個々の作品の輪郭を消すこと

"765":
  ask:
    - 積み重なった時間は、いま何に使われているのか。過去の話ではなく現在進行の仕事として見えているか
  avoid:
    - 「元祖だから」「原点だから」を価値の根拠にすること
    - 懐古の枠に入れること。他ブランドを測る基準にすること

cg:
  ask:
    - 大きな数の中で、今日の主役は誰か。固有名詞で書けているか
    - その一人にとって、これは何度目の何なのか
  avoid:
    - 人数・人気・順位・特定サービスの現況だけに話を還元すること

million:
  ask:
    - これは誰から誰へ手渡されたことなのか。集団の中の個が見えているか
  avoid:
    - 「765の後輩」「仲がよい」「ライブが強い」で説明を終えること

shiny:
  ask:
    - 断定できるところと、まだ形になっていないところの境目はどこか
    - 言葉にしすぎて、読者が自分で気づく余地を潰していないか
  avoid:
    - 一つの読みを正解として閉じること。雰囲気語だけで深く見えるふりをすること

sidem:
  ask:
    - その人が前に持っていたものは、いまの仕事の何を支えているのか
  avoid:
    - 「男性版」「異色枠」という位置づけで説明すること
    - 「アイマスだから価値がある」を結論にすること

gaku:
  ask:
    - 変わったのは何で、それは誰の働きかけで変わったのか。具体で追えているか
  avoid:
    - 新しさ・勢い・流行・ゲーム性能だけで語ること

dsva:
  ask:
    - まだ結果が出ていない時間そのものを、結果から逆算せずに書けているか
    - 当時の媒体・形式の中で成立したことを、その時代ごと受け取っているか
  avoid:
    - 「Vtuber版」「最初から決まっていた成功」と後知恵で整理すること
    - 過去作を小ネタ・珍品・ゲストとして扱うこと

joint:
  ask:
    - 交差する前、それぞれの場所で何を意味していたのか
    - 噛み合ったのは共通点か、それとも違いか
  avoid:
    - 勝敗・格・出演量で比べること
    - 「同じアイマスだから」で違いを消すこと

other:
  ask:
    - この話題を「その他」に置いたことで、当事者への敬意が薄くなっていないか
  avoid:
    - 雑多なものとしてまとめて処理すること
