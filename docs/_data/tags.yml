# タグ語彙(PIPELINE.md §9.5)。単一ソースで2つの用途を持つ。
#   用途1: 執筆プロンプトへの語彙注入 — 表記ゆれの発生源を断つ(compose.py が読む)
#   用途2: タグ索引の正規化 — 過去のゆれを索引側で吸収する(Jekyll が site.data.tags で読む)
#
# ※ 過去記事の frontmatter tags は絶対に書き換えないこと。
#    docs/_posts/ は lint.py の append-only 検査対象であり、訂正フロー以外の変更は違反になる。
#    既に発行された表記ゆれは alias でのみ吸収する。

# 索引に載せないタグ。src 値(公式/報道/ファン/未確認)やブランド判定語の混入を除去する。
drop:
  - 未確認
  - 公式
  - ファン
  - アイマス

# 表記ゆれ → 正規タグ。左辺は「過去に実際に出現した誤り」だけを列挙する(推測で増やさない)。
alias:
  # -- ブランドid の混入(frontmatter の brand と重複。タグとしては正式名に寄せる) --
  shiny: シャニマス
  million: ミリオンライブ
  sidem: SideM
  gaku: 学マス
  "765": 765AS
  CG: シンデレラガールズ

  # -- シリーズ名の表記ゆれ --
  シャイニーカラーズ: シャニマス
  SHINY COLORS: シャニマス
  シンデレラ: シンデレラガールズ
  CINDERELLA GIRLS: シンデレラガールズ
  ミリオン: ミリオンライブ
  学園アイドルマスター: 学マス
  765PRO: 765AS
  ヴイアライヴ: vα-liv
  315プロ: 315プロダクション
  TOURS: ツアマス
  アイドルマスターTOURS: ツアマス

  # -- 施策名の表記ゆれ --
  POP UP SHOP: POP UP
  POP UP STORE: POP UP
  ポップアップストア: POP UP
  ポップアップ: POP UP
  受注情報: 受注
  20th Anniversary: 20周年
  Piano Collection: ピアノコレクション

  # -- 定例企画 --
  # 【年をまたぐと壊れるので書かないこと】
  # 「IWSF → IWSF2026」のような、年を持たない表記から特定年へ寄せる alias は作らない。
  # 書いた時点では正しくても、翌年に同じ表記で書かれた記事を過去の年へ誤って束ねる。
  # 年の付与は執筆側の責務(§9.5「毎年ある定例企画は年を含める」を compose の
  # プロンプトで指示済み)。ここに書いてよいのは、同じ年を指す表記ゆれだけ。
  シンデレラガール総選挙2026: 総選挙2026

  # -- 施設・地名の表記ゆれ --
  有楽町: 有楽町マルイ
  名古屋コラボ: 名古屋
  町田市コラボ: 町田市
  スイパラ: スイーツパラダイス
  まねきねこ: カラオケまねきねこ

# 正規語彙。執筆時はこの中から優先的に選ばせる(compose.py がプロンプトに埋め込む)。
# アイドル名・会場名・作品固有名は語彙を固定できないため、ここには載せず自由記述を許す。
