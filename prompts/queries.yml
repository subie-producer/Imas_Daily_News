# 探索クエリセット(PIPELINE.md §1)。ブランドは間引かない。
#
# accounts はその面の公式アカウント。Grok の x_keyword_search へ
#   (from:A OR from:B) since:YYYY-MM-DD
# の形で1回にまとめて渡すために使う。**語を変えて何度も引くより1回を広く取るほうが安い**
# (週次上限は検索回数で決まる)。実際に出典として使われた実績から採った handle であり、
# 推測で増やさないこと(存在しない handle は結果0件になり、検索1回を無駄にする)。
#
# **ファン面(ファン創作・コスプレ・聖地巡礼・界隈の現象)は専用クエリを持たない。**
# 各面を調べる過程で漏れ出てくるものを拾う(ITEM_SCHEMA の「ファン面の副産物」)。
# 週次上限の実体は X 検索の回数なので、専用に検索枠を1面ぶん割くのは高くつく。
# 公式告知を追えばファンの反応は同じ検索結果に現れるため、拾うだけでよい。
# claude(Web検索)と grok(X調査)の両方が同じセットを使う。
#
# **topic に号数・年・回数を書かないこと。**「14thライブ」「20周年」のような値は
# 1年たたずに古くなり、その時点の検索を過去のイベントへ引っ張る。
# 恒常的な呼称(ライブ、ツアー、周年企画)で書き、個別の回次は収集側に見つけさせる。
