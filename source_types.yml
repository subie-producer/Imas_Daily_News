# 出典種別の判定表(REQUIREMENTS 2.5)
#
# 出典の種別を、URL から機械的に決めるための表。
#
# これが無かったころ、種別は収集役の自己申告だった。lint の検査は
# 「記事の src == 引用出典の最弱種別」というラベル同士の照合だったため、
# 収集役が攻略サイトを「公式」と申告すれば最弱も「公式」になって一致し、
# 過大表示を1件も防げなかった(実測 26件・18記事)。判定の根拠を URL 側へ移す。
#
# 判定は上から順に、最初に当たったものを採る:
#   1. official_paths     ドメインの一部だけが公式(作品公式サイトはドメインを問わない)
#   2. video_ids          YouTube・ニコ生は**投稿者**で決まる。ドメインでは決まらない
#   3. x_accounts         X も**アカウント**で決まる
#   4. domains            それ以外はドメイン
#   5. どれにも当たらなければ **未確認**
#
# 既定を「未確認」にしているのは意図的である。以前は「当事者が最も多いから」を
# 理由に既定を当事者にしていたが、それでは未知の個人ブログもファン動画も
# 当事者(一次発信)を名乗れてしまう。**多いことは判定の根拠にならない**(監査指摘)。
# 表に載っていない情報源は、性格が分かっていないのだから未確認である。
#
# 種別は**情報源の性格**を表す。「一次ソースへ到達できたか」という確認状態は
# 未確認 が受け持つ別軸なので、元から 未確認 だったものを種別で上書きしない。

# --- 公式: アイマス公式(公式ポータル・ブランド/作品の公式サイト・公式X) ---
# 「他はどれほど信頼できても公式を名乗らない」(規程2.5)。狭く採る。
official_paths:
  # バンナムAM配下のツアマス公式サイト(規程2.5に例として明記されている)
  - bandainamco-am.co.jp/am/vg/idolmaster-tours/

official_domains:
  - idolmaster-official.jp                          # 公式ポータル
  - cinderellagirls.idolmaster-official.jp          # シンデレラガールズ公式
  - millionlive-theaterdays.idolmaster-official.jp  # ミリオンライブ! 公式
# 公式ポータル配下の特設サイト(gakumas-summer2026. など号ごとに増える)は
# 末尾一致で公式にする。ただし**個別指定のほうが先に効く**ので、
# gakuen-label.(学マスレーベル公式サイト = 公式レーベル)は下の準公式に載せて
# 除外する。ドメインが公式ポータル配下でも、名乗っている主体で決まる(監査指摘)。
official_suffixes:
  - .idolmaster-official.jp

# --- 準公式: 公式レーベル・公式ストア等のグループ/パートナー企業 ---
semi_official_domains:
  - gakuen-label.idolmaster-official.jp   # 学マスレーベル(公式レーベル)
  - columbia.jp                           # 日本コロムビア
  - shop.columbia.jp
  - lantis.jp                             # ランティス
  - shinycolors.lantis.jp
  - shop.asobistore.jp                    # アソビストア
  - webstore.asobistore.jp                # アソビストア(別ドメイン)
  - asobistory.asobistore.jp
  - asobistage.asobistore.jp            # アソビステージ(公式配信プラットフォーム)
  - gamemusic.bn-ent.net                  # バンダイナムコのゲームミュージックレーベル
  - bandainamcomusiclive.co.jp            # バンダイナムコミュージックライブ(グループの音楽会社)
  - bandainamco-am.co.jp                  # バンナムAM(上の official_paths 以外)
  - parks2.bandainamco-am.co.jp
  - p-bandai.jp                           # プレミアムバンダイ

# --- 種類でまとめて決まるもの(末尾一致。個別指定と特設サイトの後に見る) ---
# 自治体や政府機関は、どこであってもコラボ・寄贈・観光施策の**当事者**である。
# 1つずつ表に足しても増え続けるだけなので、種類でまとめる。
suffix_types:
  ".lg.jp": 当事者      # 地方公共団体(市区町村・都道府県)
  ".go.jp": 当事者      # 政府機関

