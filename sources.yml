  url: https://bandainamco-am.co.jp/am/vg/idolmaster-tours/news/
  base: https://bandainamco-am.co.jp/am/vg/idolmaster-tours/news/
  list_regex: 'href="(\d+\.html)"[^>]*>([^<]{0,120})'
  enabled: true
- id: imasnews765
