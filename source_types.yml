  - gameo.jp              # ゲームオメガ / 株式会社New-Elements の攻略・まとめ
  - appgamelog.com        # 攻略
  - zutapoke.com          # 学マスまとめ(ファン運営)
  - imasnews765.com       # アイマスニュース765(公式ツイート引用主体のまとめ)
  - aimasupay.hatenablog.com
  - search.yahoo.co.jp    # リアルタイム検索の自動まとめページ
  - games.o-yake.com
  - skypenguin.net
  - blog.toyget.com
  - collabo-cafe.com      # コラボ情報のまとめ
  - tcg-supply-navi.com   # サプライ情報のアフィリエイト記事(販売元はアソビストア)
  - eventernote.com       # イベント情報サービス。公演の主催者ではない
  # wiki ホスティングは**ドメインで決まる**。github や楽天と違い、
  # ここに公式主体がページを持つことはなく、どのページも利用者が書いた二次情報である
  - wikiwiki.jp           # ファン運営の攻略wiki
  - atwiki.jp             # @wiki(ファンwikiのホスティング)
  - w.atwiki.jp
  - seesaawiki.jp
  - fandom.com
  - wikia.com

# --- ファン: ファン・サークル活動等の**当事者発信** ---
# 自分の営みを自分で発信しているもの。他所の発表を写しているものは 二次情報 へ。
fan_domains:
  - motoraji.jugem.jp     # もとラジ!(ファン番組の自己発信)

# --- 当事者: 主催者・販売元・自治体・コラボ先などの一次発信 ---
# ドメイン全体ではなく、その中の特定の主体だけが当事者になるもの(前方一致)。
# github.com のような**多数の利用者が同居するプラットフォーム**を丸ごと
# 当事者にすると、任意のユーザーのリポジトリまで一次発信を名乗る(監査指摘)。
party_paths:
