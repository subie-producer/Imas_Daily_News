# レーベル(ランティス)の SideM・シャニマスのお知らせ(イベント・特典)。探索では 3本中3本が遅れた
- id: lantis-shiny
  brand: shiny
  source_type: 準公式
  type: html
  url: https://shinycolors.lantis.jp/
  base: https://shinycolors.lantis.jp
  list_regex: 'href="https://shinycolors\.lantis\.jp/((?:event|extra)/\d+_\d+/)"'
  enabled: true
- id: lantis-sidem
  brand: sidem
  source_type: 準公式
  type: html
  url: https://lantis.jp/sidem/
  base: https://lantis.jp/sidem
  list_regex: 'href="((?:event|extra)/index\.html#\d+(?:_\d+)?)"'
  enabled: true
- id: columbia-imas
  brand: general
  source_type: 準公式
  type: portal          # curl は遮断されるため Selenium で取得
  url: https://columbia.jp/idolmaster/
  base: https://columbia.jp/idolmaster
  list_regex: 'href="(imasnews/\d+\.html)"[^>]*>([^<]{0,120})'
  enabled: true
- id: bnam-tours
  brand: joint
